name: Offline chat eval

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the harness and its negative control
        run: python -m unittest discover -s tests -v
      - name: Replay the offline eval
        run: python -m review_lab eval
